[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-practices"
version = "1.0.0"
description = "Systematic AI/ML learning platform from foundations to advanced topics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "zimingttkx", email = "zimingttkx@users.noreply.github.com"}
]
maintainers = [
    {name = "zimingttkx"}
]
keywords = [
    "machine-learning",
    "deep-learning",
    "artificial-intelligence",
    "pytorch",
    "tensorflow",
    "computer-vision",
    "nlp",
    "reinforcement-learning",
    "large-language-models",
    "multimodal-learning"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.32.0",
    "types-pyyaml>=6.0.0",
]
llm = [
    "transformers>=4.47.0",
    "tokenizers>=0.21.0",
    "peft>=0.14.0",
    "accelerate>=1.2.0",
    "bitsandbytes>=0.45.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.9.0",
    "sentence-transformers>=3.3.0",
]
multimodal = [
    "diffusers>=0.32.0",
    "timm>=1.0.0",
    "librosa>=0.10.0",
    "opencv-python>=4.10.0",
]
full = [
    "tensorflow>=2.18.0",
    "keras>=3.8.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "nltk>=3.9.0",
    "jupyter>=1.1.0",
    "notebook>=7.3.0",
    "jupyterlab>=4.3.0",
    "plotly>=5.24.0",
    "h5py>=3.12.0",
]

[project.urls]
Homepage = "https://github.com/zimingttkx/AI-Practices"
Repository = "https://github.com/zimingttkx/AI-Practices"
Documentation = "https://github.com/zimingttkx/AI-Practices#readme"
Issues = "https://github.com/zimingttkx/AI-Practices/issues"
Changelog = "https://github.com/zimingttkx/AI-Practices/blob/main/CHANGELOG.md"

# ============== pytest ==============
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "07-reinforcement-learning",
    "09-practical-projects",
    "10-large-language-models",
    "11-multimodal-learning",
    "12-deployment-optimization",
    "13-distributed-training",
    "14-agents-reasoning",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "--ignore=07-reinforcement-learning/03-q-learning/src/tests",
    "--ignore=07-reinforcement-learning/04-deep-q-learning/src/tests",
    "--ignore=07-reinforcement-learning/05-policy-gradient/src/tests",
    "--ignore=07-reinforcement-learning/06-actor-critic/src/tests",
    "--ignore=07-reinforcement-learning/07-advanced-algorithms/src/tests",
    "--ignore=09-practical-projects/04-time-series/02-stock-prediction-lstm/test_all.py",
    "--ignore=09-practical-projects/05-kaggle-competitions/02-Feedback-ELL-1st-Place",
    "--ignore=09-practical-projects/06-reinforcement-learning",
    "--ignore=14-agents-reasoning/02-reasoning/tests",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests that require GPU",
    "integration: marks integration tests",
    "unit: marks unit tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

# ============== coverage ==============
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/node_modules/*",
    "*.ipynb",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = true

# ============== black ==============
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | node_modules
    | __pycache__
    | \.ipynb_checkpoints
)/
'''

# ============== ruff ==============
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "E731",   # do not assign a lambda expression
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["B011", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["ai_practices"]

# ============== mypy ==============
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "node_modules",
    "build",
    "dist",
    "__pycache__",
]
